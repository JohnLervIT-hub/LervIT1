[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
# The `puppeteer` npm package downloads its own Chromium into
# node_modules/puppeteer/.local-chromium during install, so we don't need
# a system chromium package. Nixpacks caches this dir across builds.
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]
