workflows:

  # ─────────────────────────────────────────────
  # iOS – TestFlight / App Store distribution
  # ─────────────────────────────────────────────
  ios-release:
    name: LervIT iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - lervit_app_store   # Add this group in Codemagic → Teams → Global variables
      vars:
        BUNDLE_ID: com.lervit.app
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 20.11.1
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install Node dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build
        env:
          # Pull any VITE_ vars from the group so the web build has them
          VITE_STRIPE_PUBLIC_KEY: $VITE_STRIPE_PUBLIC_KEY
          VITE_GOOGLE_MAPS_API_KEY: $VITE_GOOGLE_MAPS_API_KEY

      - name: Capacitor sync
        script: npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Set build number from Codemagic run number
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID") + 1))
          xcrun agvtool new-version -all "$BUILD_NUMBER"
        ignore_failure: true   # First build or no existing build is fine

      - name: Code sign + build (App Store)
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme  "$XCODE_SCHEME" \
            --config  Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration          # Uses the App Store Connect API key from the Codemagic integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
      email:
        recipients:
          - builds@lervit.com
        notify:
          success: true
          failure: true

  # ─────────────────────────────────────────────
  # iOS – Ad-hoc build for device testing
  # ─────────────────────────────────────────────
  ios-adhoc:
    name: LervIT iOS Ad-Hoc
    max_build_duration: 45
    instance_type: mac_mini_m2

    environment:
      groups:
        - lervit_app_store
      vars:
        BUNDLE_ID: com.lervit.app
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 20.11.1
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install Node dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build
        env:
          VITE_STRIPE_PUBLIC_KEY: $VITE_STRIPE_PUBLIC_KEY
          VITE_GOOGLE_MAPS_API_KEY: $VITE_GOOGLE_MAPS_API_KEY

      - name: Capacitor sync
        script: npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Code sign + build (Ad-hoc)
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT" --type ad-hoc
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme  "$XCODE_SCHEME" \
            --config  Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - builds@lervit.com
        notify:
          success: true
          failure: true

  # ─────────────────────────────────────────────
  # Android – Google Play release
  # ─────────────────────────────────────────────
  android-release:
    name: LervIT Android Release
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      groups:
        - lervit_google_play  # Add this group in Codemagic → Teams → Global variables
      vars:
        PACKAGE_NAME: com.lervit.app
      node: 20.11.1
      java: 17

    scripts:
      - name: Install Node dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build
        env:
          VITE_STRIPE_PUBLIC_KEY: $VITE_STRIPE_PUBLIC_KEY
          VITE_GOOGLE_MAPS_API_KEY: $VITE_GOOGLE_MAPS_API_KEY

      - name: Capacitor sync
        script: npx cap sync android

      - name: Set build number
        script: |
          BUILD_NUMBER=$(($PROJECT_BUILD_NUMBER))
          cd android
          sed -i "s/versionCode .*/versionCode $BUILD_NUMBER/" app/build.gradle

      - name: Build Android release AAB
        script: |
          cd android
          ./gradlew bundleRelease

      - name: Sign AAB
        script: |
          android-app-bundle sign \
            --ks              "$CM_KEYSTORE_PATH" \
            --ks-pass         "$CM_KEYSTORE_PASSWORD" \
            --ks-key-alias    "$CM_KEY_ALIAS" \
            --key-pass        "$CM_KEY_PASSWORD" \
            --bundle          android/app/build/outputs/bundle/release/app-release.aab

    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false
      email:
        recipients:
          - builds@lervit.com
        notify:
          success: true
          failure: true
