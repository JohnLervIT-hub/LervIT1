

  # ─────────────────────────────────────────────
  # iOS – TestFlight / App Store distribution
  # ─────────────────────────────────────────────
        workflows:
          ios-release:
            name: LervIT iOS Release
            max_build_duration: 60
            instance_type: mac_mini_m2

            environment:
              groups:
                - lervit_app_store
              vars:
                BUNDLE_ID: com.lervit.app
                XCODE_PROJECT: ios/App/App.xcodeproj
                XCODE_SCHEME: App
                VITE_STRIPE_PUBLIC_KEY: $VITE_STRIPE_PUBLIC_KEY
                VITE_GOOGLE_MAPS_API_KEY: $VITE_GOOGLE_MAPS_API_KEY
              node: 20.11.1
              xcode: latest
              cocoapods: default

            triggering:
              events:
                - push
              branch_patterns:
                - pattern: main
                  include: true

            scripts:
              - name: Install Node dependencies
                script: npm ci

              - name: Build web assets
                script: npm run build

              - name: Capacitor sync
                script: npx cap sync ios

              - name: Install CocoaPods
                script: |
                  cd ios/App
                  pod install

              - name: Set build number
                script: |
                  BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" || echo 0) + 1))
                  cd ios/App
                  xcrun agvtool new-version -all "$BUILD_NUMBER"

              - name: Code sign + build
                script: |
                  xcode-project use-profiles --project "$XCODE_PROJECT"
                  xcode-project build-ipa \
                    --project "$XCODE_PROJECT" \
                    --scheme "$XCODE_SCHEME" \
                    --config Release

            artifacts:
              - build/ios/ipa/*.ipa
              - /tmp/xcodebuild_logs/*.log
              - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

            publishing:
              app_store_connect:
                auth: integration
                submit_to_testflight: true
              email:
                recipients:
                  - builds@lervit.com
                notify:
                  success: true
                  failure: true
  